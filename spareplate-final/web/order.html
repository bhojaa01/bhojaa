<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pickup</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap" style="max-width:640px">
    <p><a href="mine.html">← My requests</a></p>
    <h1>Pickup details</h1>
    <div class="card"><div class="pad">
      <span class="badge time">Accepted · Ready</span>
      <h3 style="margin:10px 0">Veg thali · 2 servings</h3>
      <p>12, 4th Cross, Koramangala<br>Call after you reach the gate.</p>
      <p class="ok" id="done"></p>
      <p class="row" style="margin-top:14px">
        <button class="btn" type="button" onclick="done.textContent='Collected. Thank you.'">I collected it</button>
        <a class="ghost" href="app.html">Back</a>
      </p>
    </div></div>
  </div>
</body>
</html>
